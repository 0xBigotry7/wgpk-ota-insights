[project]
name = "wgpk-ota-insights"
version = "0.1.0"
description = "Read-only OTA metrics collector + weekly AI ops analysis for Wyndham Garden Phuket Kamala"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.47",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.setuptools.packages]
find = { include = ["ota*"] }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
