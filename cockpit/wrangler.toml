name = "wgpk-ota-cockpit"
main = "src/worker.js"
compatibility_date = "2026-05-05"
workers_dev = true

routes = [
  { pattern = "ota.wyndhamgardenkamala.com", custom_domain = true }
]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

# Create once with `wrangler d1 create wgpk_ota`, paste the id here, then
# `wrangler d1 execute wgpk_ota --remote --file schema.sql`.
[[d1_databases]]
binding = "DB"
database_name = "wgpk_ota"
database_id = "2429868e-8aeb-441b-ac8f-f2ab654ce12e"

# Secrets (wrangler secret put): DASHBOARD_PASSWORD, SESSION_SECRET, OTA_INGEST_TOKEN.
# There are no defaults: without them login and ingest are refused.

# Daily alert push at 12:30 Bangkok, after the 10:20 run and its 11:30 fallback. Sends only when the
# TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets are set.
[triggers]
crons = ["30 5 * * *"]

# Copilot model: Workers AI by default; set COPILOT_API_KEY (+ COPILOT_BASE_URL, COPILOT_MODEL) for an
# OpenAI-compatible API such as DeepSeek or OpenAI instead.
[ai]
binding = "AI"
