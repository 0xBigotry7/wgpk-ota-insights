<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OTA 驾驶舱</title>
<style>
/* Layout: one column; health strip, then the day's report, then one block per platform with a metric table. */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --fg:#1F2A26; --muted:#5F6D66; --line:#E1E7E3;
  --accent:#2F6B53; --accent-soft:#E2EFE8;
  --ok:#2C7A4B; --ok-soft:#E2F2E8; --warn:#9A6400; --warn-soft:#F7EDD6; --bad:#B23A3A; --bad-soft:#F6E1E1;
  --font:'PingFang SC','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1A2320; --fg:#E4ECE8; --muted:#9AABA3; --line:#2C3A35;
  --accent:#6FC4A0; --accent-soft:#1D3229; --ok:#6FCF93; --ok-soft:#1B3326; --warn:#E6B450; --warn-soft:#352B14;
  --bad:#EF8A8A; --bad-soft:#3A1F1F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1A2320; --fg:#E4ECE8; --muted:#9AABA3; --line:#2C3A35;
  --accent:#6FC4A0; --accent-soft:#1D3229; --ok:#6FCF93; --ok-soft:#1B3326; --warn:#E6B450; --warn-soft:#352B14;
  --bad:#EF8A8A; --bad-soft:#3A1F1F; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-left,0px)) 56px;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
h1{margin:0;font-size:24px;letter-spacing:.01em}
h2{margin:0 0 12px;font-size:17px}
.meta{color:var(--muted);font-size:13px}
a{color:var(--accent)}
.health{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.chip b{font-size:14px}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;font-weight:600;width:max-content}
.s-ok{background:var(--ok-soft);color:var(--ok)} .s-warn{background:var(--warn-soft);color:var(--warn)} .s-bad{background:var(--bad-soft);color:var(--bad)}
.advice{display:grid;gap:10px}
.rhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.hl{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.hl li{display:flex;gap:8px;align-items:baseline}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--muted);transform:translateY(-1px)}
.dot.good{background:var(--ok)} .dot.bad{background:var(--bad)}
.kv{display:grid;grid-template-columns:4.5em 1fr;gap:4px 10px;margin-top:8px}
.kv dt{color:var(--muted);font-size:13px} .kv dd{margin:0;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 8px}
.watch{margin:0;padding-left:1.2em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 4px;font-size:15px}
.card p{margin:4px 0 0}
.lede{background:var(--accent-soft);border-radius:12px;padding:14px 16px}
.platform{display:flex;flex-direction:column;gap:8px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:9px 12px;white-space:nowrap;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--muted)}
svg.spark{display:block}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:16px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:12px 14px}
.health{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.chip .why{font-size:12px;color:var(--muted);margin:2px 0 0;padding-left:1.1em}
.vs{font-size:12px}
/* Phone: tables become one card per row, each cell labelled from its column header. */
@media (max-width:640px){
  .wrap{gap:22px;padding-top:16px}
  h1{font-size:20px}
  .kv{grid-template-columns:1fr}
  .kv dt{margin-top:4px}
  .tbl{overflow:visible;background:none;border:0}
  table.stack{min-width:0}
  table.stack thead{display:none}
  table.stack tr{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  table.stack td{border:0;padding:2px 0;white-space:normal}
  table.stack td.full{grid-column:1/-1}
  table.stack td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted)}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>OTA 驾驶舱</h1>
      <div class="meta">Wyndham Garden Phuket Kamala · 每天 10:20 从各平台后台只读采集</div>
    </div>
    <div class="meta"><span id="last-run">加载中…</span> · <a href="/logout">退出</a></div>
  </header>

  <section>
    <div class="rhead"><h2 style="margin:0">每日分析建议</h2>
      <label class="meta">报告日期 <select id="report-day" aria-label="选择报告日期"></select></label></div>
    <div class="advice" id="advice" style="margin-top:12px"></div>
  </section>

  <section>
    <h2>核心 KPI（近 30 / 90 天）</h2>
    <p class="meta" style="margin:-6px 0 10px">曝光、浏览、点击率、转化、预订、间夜、房价、收入。“较同类”是平台自己给的同类酒店对比值，以及我们比它高或低多少。“未接入”表示这个平台的数据页还没找到或拿不到这个时段。</p>
    <div class="tbl"><table id="kpi" class="stack">
      <thead><tr><th>指标</th><th>平台</th><th>近 30 天</th><th>近 90 天</th><th>较同类</th><th>日期</th></tr></thead>
      <tbody></tbody></table></div>
  </section>

  <section>
    <h2>平台状态</h2>
    <p class="meta" style="margin:-6px 0 10px">每个平台最近一次读取的结果。没读到的会写明原因和怎么恢复。</p>
    <div class="health" id="health"></div>
  </section>

  <section>
    <h2>各平台指标</h2>
    <div id="platforms" style="display:flex;flex-direction:column;gap:22px"></div>
  </section>
</div>

<script>
const NAMES = {booking:"Booking.com", agoda:"Agoda", expedia:"Expedia", ctrip:"携程 / 去哪儿 / 同程",
  google:"Google", tripadvisor:"TripAdvisor", medallia:"Medallia（品牌问卷）"};
const STATUS = {ok:["正常","s-ok"], signed_out:["未登录","s-bad"], page_missing:["页面缺失","s-warn"], error:["出错","s-warn"]};
const RANK = {ok:0, page_missing:1, error:2, signed_out:3};
const PERIODS = {last_30_days:"近 30 天", next_30_days:"未来 30 天", last_12_months:"近 12 个月", last_13_months:"近 13 个月",
  last_90_days:"近 90 天", last_28_days:"近 28 天", next_28_days:"未来 28 天", next_90_days:"未来 90 天",
  funnel:"排名看板默认时段", month_to_date:"本月至今", last_month:"上月", latest_month:"最近一个月",
  booked_last_30_days:"近 30 天新增", booked_last_90_days:"近 90 天新增"};
const PRIORITY = {high:["优先","s-bad"], medium:["近期","s-warn"], low:["可选","s-ok"]};
const AREAS = {price:"价格", traffic:"流量曝光", conversion:"转化", reputation:"口碑评分", experience:"客人体验", content:"页面内容", data:"数据缺口"};

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (v, unit) => {
  const n = Math.abs(v) >= 1000 ? v.toLocaleString("en-US", {maximumFractionDigits:0}) : (+v.toFixed(2)).toString();
  return unit === "%" ? n + "%" : unit ? `${n} ${unit}` : n;
};

function spark(points){
  if (points.length < 2) return "";
  const w = 96, h = 26, xs = points.map((_, i) => i * (w - 4) / (points.length - 1) + 2);
  const lo = Math.min(...points), hi = Math.max(...points), span = hi - lo || 1;
  const ys = points.map(v => h - 3 - (v - lo) / span * (h - 6));
  const d = xs.map((x, i) => `${i ? "L" : "M"}${x.toFixed(1)} ${ys[i].toFixed(1)}`).join("");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
    <circle cx="${xs.at(-1)}" cy="${ys.at(-1)}" r="2.5" fill="var(--accent)"/></svg>`;
}

// Why a page gave no numbers, in words the hotel team can act on.
function why(p){
  const page = p.page === "landing" ? "首页" : p.page;
  if (p.status === "signed_out") return p.page === "landing"
    ? "未登录：点评系统下次自动登录（09:15 / 14:45）后会恢复"
    : `${page}：要单独登录一次（需人工登录）`;
  if (p.status === "page_missing") return `${page}：数据页地址待确认`;
  if (p.status === "error") return `${page}：数据没加载出来，下次再读`;
  return "";
}
const runTime = id => `${id.slice(4,6)}-${id.slice(6,8)} ${id.slice(9,11)}:${id.slice(11,13)}`;

function health(state){
  document.getElementById("health").innerHTML = state.platforms.map(pf => {
    const pages = state.pages.filter(x => x.platform === pf);
    if (!pages.length) return `<div class="chip"><b>${esc(NAMES[pf])}</b><span class="pill s-warn">没有数据</span>
      <span class="meta">最近 3 天没有读取记录</span></div>`;
    const worst = pages.reduce((a, b) => RANK[b.status] > RANK[a.status] ? b : a);
    const landing = pages.find(x => x.page === "landing");
    // A platform is "部分可读" when its home page works but some report pages do not.
    const [label, cls] = worst.status === "ok" ? STATUS.ok
      : landing && landing.status === "ok" ? ["部分可读", "s-warn"] : STATUS[worst.status];
    const ok = pages.filter(x => x.status === "ok").length;
    const last = pages.map(x => x.run_id).sort().at(-1);
    const reasons = pages.filter(x => x.status !== "ok").map(why);
    const metricCount = state.metrics.filter(m => m.platform === pf && m.day === state.metrics.filter(n => n.platform === pf).at(-1)?.day).length;
    return `<div class="chip"><b>${esc(NAMES[pf])}</b><span class="pill ${cls}">${label}</span>
      <span class="meta">${ok}/${pages.length} 个页面读到${metricCount ? ` · ${metricCount} 个指标` : ""} · ${esc(runTime(last))}</span>
      ${reasons.length ? `<ul class="why">${reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}</div>`;
  }).join("");
}

function advice(state){
  const el = document.getElementById("advice"), pick = document.getElementById("report-day");
  if (!state.advice.length) {
    pick.hidden = true;
    el.innerHTML = `<div class="empty">还没有报告。每天采集完会自动生成一份，每条建议都附上依据的数字。</div>`;
    return;
  }
  pick.hidden = false;
  pick.innerHTML = state.advice.map((a, i) => `<option value="${i}">${esc(a.id)}</option>`).join("");
  pick.onchange = () => renderReport(state.advice[+pick.value]);
  renderReport(state.advice[0]);
}

function renderReport(a){
  const el = document.getElementById("advice");
  const hl = (a.highlights || []).length ? `<div class="card"><h3>今日要点</h3><ul class="hl">${a.highlights.map(h =>
      `<li><span class="dot ${h.tone === "good" ? "good" : h.tone === "bad" ? "bad" : ""}"></span><span>${NAMES[h.platform] ? `<b>${esc(NAMES[h.platform])}</b> ` : ""}${esc(h.text)}</span></li>`).join("")}</ul></div>` : "";
  const order = {high:0, medium:1, low:2};
  const items = [...(a.items || [])].sort((x, y) => (order[x.priority] ?? 1) - (order[y.priority] ?? 1)).map(it => {
    const [pl, pc] = PRIORITY[it.priority] || PRIORITY.medium;
    const row = (k, v) => v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : "";
    return `<div class="card"><div class="tags"><span class="pill ${pc}">${pl}</span>
        <span class="tag">${esc(NAMES[it.platform] || "全部平台")}</span>${AREAS[it.area] ? `<span class="tag">${AREAS[it.area]}</span>` : ""}
        ${it.owner ? `<span class="tag">负责：${esc(it.owner)}</span>` : ""}</div>
      <h3 style="margin-top:8px">${esc(it.title)}</h3>
      <dl class="kv">${row("依据", it.evidence)}${row("分析", it.analysis)}${row("怎么做", it.action)}${row("看效果", it.expected)}</dl></div>`;
  }).join("");
  const watch = (a.watch || []).length ? `<div class="card"><h3>明天继续盯</h3><ul class="watch">${a.watch.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : "";
  el.innerHTML = `<div class="lede"><b>${esc(a.id)}</b> · ${esc(a.summary)}</div>` + hl + items + watch;
}

function platforms(state){
  const el = document.getElementById("platforms");
  if (!state.metrics.length) { el.innerHTML = `<div class="empty">还没有指标。每天采集后会从各平台页面里提取数字放到这里。</div>`; return; }
  const by = {};
  for (const m of state.metrics) {
    const key = `${m.platform}|${m.metric}|${m.period}`;
    (by[key] ||= []).push(m);
  }
  el.innerHTML = state.platforms.map(pf => {
    const series = Object.entries(by).filter(([k]) => k.startsWith(pf + "|")).map(([, rows]) => rows);
    if (!series.length) return "";
    const rows = series.map(rows => {
      const last = rows.at(-1), lastDay = Date.parse(last.day);
      const ref = [...rows].reverse().find(r => lastDay - Date.parse(r.day) >= 7 * 864e5);
      let delta = "—", cls = "flat";
      if (ref) {
        const d = last.value - ref.value;
        cls = d > 0 ? "up" : d < 0 ? "down" : "flat";
        delta = `${d > 0 ? "+" : ""}${fmt(d, last.unit)}`;
      }
      return `<tr><td class="full">${esc(last.label)}${last.period ? `<div class="meta">${esc(PERIODS[last.period] || last.period)}</div>` : ""}</td>
        <td class="num" data-l="最新"><b>${esc(fmt(last.value, last.unit))}</b></td>
        <td class="num ${cls}" data-l="比 7 天前">${esc(delta)}</td>
        <td class="num" data-l="平台对比值">${last.benchmark == null ? "—" : esc(fmt(last.benchmark, last.unit))}</td>
        <td data-l="趋势">${spark(rows.slice(-30).map(r => r.value)) || `<span class="meta">—</span>`}</td>
        <td class="meta full">${esc(last.day)}</td></tr>`;
    }).join("");
    return `<div class="platform"><h2 style="margin:0">${esc(NAMES[pf])}</h2><div class="tbl"><table class="stack">
      <thead><tr><th>指标</th><th>最新</th><th>比 7 天前</th><th>平台对比值</th><th>近 30 次</th><th>日期</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>`;
  }).join("");
}

// 杨总's KPI list → where each number comes from. [platform, metric@period for 30 days, for 90 days, note].
const KPI = [
  ["搜索曝光", [["booking", "search_views@funnel", null, "90 天需在页面上切换"], ["tripadvisor", "listing_impressions@last_30_days", null]]],
  ["房源页浏览", [["booking", "page_visits@funnel", null], ["expedia", "page_views_28d@last_28_days", null, "Expedia 为近 28 天"],
    ["tripadvisor", "unique_visitors@last_30_days", null]]],
  ["点击率（曝光→浏览）", [["booking", "click_rate@funnel", null]]],
  ["预订转化率", [["booking", "book_rate@funnel", "conversion_rate_90d@last_90_days"], ["expedia", "conversion_rate_28d@last_28_days", null]]],
  ["预订数（毛）", [["booking", "bookings@funnel", null], ["tripadvisor", "booking_clicks@last_30_days", null, "TripAdvisor 为预订点击"]]],
  ["净预订（扣取消）", [["booking", null, null, "取消数据页还没找到"]]],
  ["间夜", [["booking", "room_nights_30d@last_30_days", "room_nights_90d@last_90_days"], ["expedia", "room_nights_28d@last_28_days", null]]],
  ["平均房价 ADR", [["booking", "adr_30d@last_30_days", "adr_90d@last_90_days"]]],
  ["收入", [["booking", "revenue_30d@last_30_days", "revenue_90d@last_90_days"], ["expedia", "revenue_28d@last_28_days", null]]],
];
const KPI_MISSING = [["agoda", "数据分析页地址待确认"], ["ctrip", "数据分析页地址待确认"]];

function kpis(state){
  const latest = {};
  for (const m of state.metrics) latest[`${m.platform}|${m.metric}@${m.period}`] = m;
  const cell = (pf, key) => {
    const m = key && latest[`${pf}|${key}`];
    return m ? `<b>${esc(fmt(m.value, m.unit))}</b>` : `<span class="meta">未接入</span>`;
  };
  // "较同类": the platform's own comparison value and how far above (green) or below (red) we are.
  // Percentages compare in points (2.56% vs 3.10% → −0.54 pt); everything else in relative %.
  const versus = (pf, k30, k90) => [[k30, "30 天"], [k90, "90 天"]].map(([k, w]) => {
    const m = k && latest[`${pf}|${k}`];
    if (!m || m.benchmark == null) return "";
    const d = m.unit === "%" ? m.value - m.benchmark : m.benchmark ? (m.value - m.benchmark) / Math.abs(m.benchmark) * 100 : null;
    const tag = d == null ? "" : `<span class="${d > 0 ? "up" : d < 0 ? "down" : "flat"}">${d > 0 ? "+" : d < 0 ? "−" : "±"}${Math.abs(d).toFixed(m.unit === "%" ? 2 : 1)}${m.unit === "%" ? " 个百分点" : "%"}</span>`;
    return `<div>${tag} <span class="meta vs">${k30 && k90 ? w + " · " : ""}同类 ${esc(fmt(m.benchmark, m.unit))}</span></div>`;
  }).join("");
  const rows = [];
  for (const [label, sources] of KPI) {
    for (const [pf, k30, k90, note] of sources) {
      const ref = latest[`${pf}|${k30}`] || latest[`${pf}|${k90}`];
      rows.push(`<tr><td class="full"><b>${esc(label)}</b></td><td class="full" data-l="平台">${esc(NAMES[pf])}${note ? `<div class="meta">${esc(note)}</div>` : ""}</td>
        <td class="num" data-l="近 30 天">${cell(pf, k30)}</td><td class="num" data-l="近 90 天">${cell(pf, k90)}</td>
        <td class="num full" data-l="较同类">${versus(pf, k30, k90) || "—"}</td>
        <td class="meta full">${ref ? esc(ref.day) : ""}</td></tr>`);
    }
  }
  for (const [pf, why] of KPI_MISSING) rows.push(`<tr><td class="full"><b>全部 KPI</b></td><td class="full">${esc(NAMES[pf])}</td><td colspan="4" class="meta full">${esc(why)}</td></tr>`);
  document.querySelector("#kpi tbody").innerHTML = rows.join("");
}

async function load(){
  try {
    const r = await fetch("/api/state", {credentials: "same-origin"});
    if (r.status === 401) { location.href = "/login"; return; }
    const state = await r.json();
    const run = state.latest_run;
    document.getElementById("last-run").textContent = run
      ? `最近一次采集 ${run.id.slice(0,4)}-${run.id.slice(4,6)}-${run.id.slice(6,8)} ${run.id.slice(9,11)}:${run.id.slice(11,13)}（${run.outcome === "done" ? "完成" : run.outcome || "进行中"}）`
      : "还没有采集记录";
    health(state); advice(state); kpis(state); platforms(state);
  } catch (e) {
    document.querySelector(".wrap").insertAdjacentHTML("beforeend", `<div class="err">读取数据失败：${esc(e.message)}。刷新页面再试。</div>`);
  }
}
load();
</script>
</body>
</html>
