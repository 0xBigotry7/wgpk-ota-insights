name: deploy-cockpit
# Deploys the OTA cockpit Worker on every push to main that touches cockpit/. Needs repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (Workers + D1 edit); skips cleanly without them.
on:
  push:
    branches: [main]
    paths: ["cockpit/**", ".github/workflows/deploy-cockpit.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: cockpit
    steps:
      - uses: actions/checkout@v4
      - run: npm test
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set; skipping deploy."; echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: Find or create the D1 database, apply schema
        if: steps.secrets.outputs.ok == 'true'
        run: |
          W="npx --yes wrangler@4"
          ID=$($W d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s).find(x=>x.name==="wgpk_ota");process.stdout.write(d?d.uuid:"")})')
          if [ -z "$ID" ]; then $W d1 create wgpk_ota; ID=$($W d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).find(x=>x.name==="wgpk_ota").uuid))'); fi
          sed -i "s/REPLACE_WITH_D1_ID/$ID/" wrangler.toml
          $W d1 execute wgpk_ota --remote --file schema.sql
      - name: Deploy
        if: steps.secrets.outputs.ok == 'true'
        run: npx --yes wrangler@4 deploy
